<section class="kanban-column" [attr.data-status]="status" [attr.aria-label]="label">
  <header class="column-header"><h3><i class="status-dot"></i>{{ label }} <span class="count">{{ tasks.length }}</span></h3><button class="icon-button" (click)="taskAdd.emit()" [attr.aria-label]="'Ajouter une tâche : ' + label">+</button></header>
  <div cdkDropList [cdkDropListData]="tasks" [id]="status" [cdkDropListDisabled]="dragDisabled" (cdkDropListDropped)="taskDropped.emit($event)" class="column-body">
    <app-task-card *ngFor="let task of tasks; trackBy: trackById" cdkDrag [cdkDragDisabled]="dragDisabled" [cdkDragData]="task" [cdkDragStartDelay]="{touch: 250, mouse: 0}" [task]="task" (selected)="taskSelected.emit($event)" (edit)="taskEdit.emit($event)" (archive)="taskArchive.emit($event)" (duplicate)="taskDuplicate.emit($event)" (statusChange)="taskStatus.emit({task: task, status: $event})"></app-task-card>
    <div *ngIf="tasks.length === 0" class="column-empty"><span aria-hidden="true">＋</span><p>Un peu d’espace pour la suite.</p><button class="quiet" (click)="taskAdd.emit()">Ajouter une tâche</button></div>
  </div>
  <button class="add-in-column" (click)="taskAdd.emit()">+ Ajouter une tâche</button>
</section>
