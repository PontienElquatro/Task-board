<section class="kanban-column rounded-xl border border-gray-200 bg-gray-50 p-4 dark:border-gray-800 dark:bg-gray-900/50" [attr.data-status]="status" [attr.aria-label]="label">
  <header class="column-header mb-4 flex items-center justify-between gap-2"><h3 class="flex items-center gap-2 text-sm font-semibold text-gray-900 dark:text-gray-100"><i class="size-2 rounded-full" [ngClass]="status === 'done' ? 'bg-emerald-500' : status === 'in-progress' ? 'bg-orange-500' : 'bg-blue-500'"></i>{{ label }} <span class="rounded bg-white px-2 py-1 text-xs font-normal text-gray-500 dark:bg-gray-800 dark:text-gray-400">{{ tasks.length }}</span></h3><button class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-lg p-2 text-blue-600 hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-blue-600 dark:text-blue-400 dark:hover:bg-blue-950" (click)="taskAdd.emit()" [attr.aria-label]="'Ajouter une tâche : ' + label"><app-icon name="plus" /></button></header>
  <div cdkDropList [cdkDropListData]="tasks" [id]="status" [cdkDropListDisabled]="dragDisabled" (cdkDropListDropped)="taskDropped.emit($event)" class="column-body flex min-h-40 flex-col gap-4 rounded-lg border border-transparent p-2 transition-colors duration-200 [&.cdk-drop-list-receiving]:border-blue-300 [&.cdk-drop-list-receiving]:bg-blue-50/50 [&.cdk-drop-list-dragging]:border-blue-300 [&.cdk-drop-list-dragging]:bg-blue-50/50 dark:[&.cdk-drop-list-receiving]:border-blue-500 dark:[&.cdk-drop-list-receiving]:bg-blue-950/50 dark:[&.cdk-drop-list-dragging]:bg-blue-950/50 motion-reduce:transition-none">
    <app-task-card *ngFor="let task of tasks; trackBy: trackById" cdkDrag [cdkDragDisabled]="dragDisabled" [cdkDragData]="task" [cdkDragStartDelay]="{touch: 250, mouse: 0}" [task]="task" (selected)="taskSelected.emit($event)" (edit)="taskEdit.emit($event)" (archive)="taskArchive.emit($event)" (duplicate)="taskDuplicate.emit($event)" (statusChange)="taskStatus.emit({task: task, status: $event})"></app-task-card>
    <div *ngIf="tasks.length === 0" class="grid justify-items-center gap-2 py-8 text-center"><p class="text-sm text-gray-600 dark:text-gray-300">Aucune tâche {{status === 'done' ? 'terminée' : status === 'in-progress' ? 'en cours' : 'à faire'}}.</p><p class="text-xs text-gray-500 dark:text-gray-400">Ajoutez une carte ou déplacez-en une ici.</p></div>
  </div>
  <button class="mt-4 min-h-11 w-full rounded-lg border border-gray-200 px-4 py-2 text-xs text-blue-600 transition-colors duration-200 hover:border-blue-300 hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-blue-600 dark:border-gray-700 dark:text-blue-400 dark:hover:bg-blue-950" (click)="taskAdd.emit()"><span class="inline-flex items-center gap-2"><app-icon name="plus" />Ajouter une tâche</span></button>
</section>
