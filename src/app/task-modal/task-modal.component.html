<!-- 🔍 Modale de consultation -->
<div *ngIf="task && mode === 'view'" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-lg relative">
    <button (click)="close.emit()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700">✕</button>
    <div class="mb-2">
      <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded"
            [ngClass]="{
              'bg-red-100 text-red-700': task.priority === 'high',
              'bg-yellow-100 text-yellow-700': task.priority === 'medium',
              'bg-gray-100 text-gray-700': task.priority === 'low' || !task.priority
            }">
        {{ task.priority || 'medium' }}
      </span>
    </div>
    <h2 class="text-xl font-bold mb-2">{{ task.title }}</h2>
    <p class="text-gray-700">{{ task.description }}</p>
    <div class="mt-4 text-sm text-gray-500">
      Statut : <span class="font-semibold px-2 py-1 bg-gray-100 rounded text-gray-800">{{ task.status }}</span>
    </div>
  </div>
</div>

<!-- ✏️ Modale d'édition / Création -->
<div *ngIf="tempTask && mode === 'edit'" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-lg relative">
    <button (click)="close.emit()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700">✕</button>
    <h2 class="text-xl font-bold mb-4">{{ tempTask.id ? 'Modifier la tâche' : 'Nouvelle tâche' }}</h2>

    <form (ngSubmit)="onSave()" #taskForm="ngForm">
      <div class="mb-4">
        <label class="block text-gray-700 mb-1">Titre</label>
        <input [(ngModel)]="tempTask.title" name="title" required #title="ngModel"
               class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
               [class.border-red-500]="title.invalid && title.touched"
               placeholder="Ex: Finir le rapport" />
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 mb-1">Description</label>
        <textarea [(ngModel)]="tempTask.description" name="description" rows="3"
                  class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
                  placeholder="Détails de la tâche..."></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-6">
        <div>
          <label class="block text-gray-700 mb-1">Statut</label>
          <select [(ngModel)]="tempTask.status" name="status" class="w-full border rounded px-3 py-2 outline-none">
            <option value="todo">À faire</option>
            <option value="in-progress">En cours</option>
            <option value="done">Terminé</option>
          </select>
        </div>
        <div>
          <label class="block text-gray-700 mb-1">Priorité</label>
          <select [(ngModel)]="tempTask.priority" name="priority" class="w-full border rounded px-3 py-2 outline-none">
            <option value="low">Basse</option>
            <option value="medium">Moyenne</option>
            <option value="high">Haute</option>
          </select>
        </div>
      </div>

      <div class="flex justify-end space-x-3">
        <button type="button" (click)="close.emit()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Annuler</button>
        <button type="submit" [disabled]="taskForm.invalid"
                class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 disabled:opacity-50">
          {{ tempTask.id ? 'Enregistrer' : 'Créer' }}
        </button>
      </div>
    </form>
  </div>
</div>

<!-- 🗑️ Modale de confirmation de suppression -->
<div *ngIf="task && mode === 'delete'" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-lg">
    <h2 class="text-xl font-bold mb-4">Confirmer la suppression</h2>
    <p class="mb-6">Es-tu sûr de vouloir supprimer la tâche "<strong>{{ task.title }}</strong>" ?</p>
    <div class="flex justify-end space-x-4">
      <button (click)="close.emit()" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Annuler</button>
      <button (click)="confirmDelete.emit()" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">Supprimer</button>
    </div>
  </div>
</div>
