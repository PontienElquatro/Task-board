<div *ngIf="task" (click)="onClick()" class="p-4 bg-white border-l-4 shadow rounded hover:shadow-md transition cursor-pointer relative group"
     [ngClass]="{
       'border-blue-500': task.status === 'todo',
       'border-yellow-500': task.status === 'in-progress',
       'border-green-500': task.status === 'done'
     }">

  <div class="flex justify-between items-start mb-2">
    <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded"
          [ngClass]="{
            'bg-red-100 text-red-700': task.priority === 'high',
            'bg-yellow-100 text-yellow-700': task.priority === 'medium',
            'bg-gray-100 text-gray-700': task.priority === 'low' || !task.priority
          }">
      {{ task.priority || 'medium' }}
    </span>
  </div>

  <h3 class="font-bold text-lg text-gray-800 leading-tight">{{ task.title }}</h3>
  <p class="text-sm text-gray-500 mt-1 line-clamp-2">{{ task.description }}</p>

  <div class="mt-4 flex space-x-4 opacity-0 group-hover:opacity-100 transition-opacity">
    <button (click)="onEdit($event)" class="text-blue-500 hover:text-blue-700 text-sm font-medium">Modifier</button>
    <button (click)="onDelete($event)" class="text-red-500 hover:text-red-700 text-sm font-medium">Supprimer</button>
  </div>
</div>
