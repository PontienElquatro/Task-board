<article *ngIf="task" class="task-card group rounded-xl border border-gray-200 bg-white p-4 shadow-sm transition-all duration-200 ease-in-out hover:-translate-y-0.5 hover:shadow-md motion-reduce:transform-none motion-reduce:transition-none dark:border-gray-700 dark:bg-gray-800">
  <div class="mb-2 flex items-center justify-between gap-2">
    <span class="rounded px-2 py-1 text-xs font-medium" [ngClass]="task.priority === 'high' ? 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-200' : task.priority === 'medium' ? 'bg-yellow-100 text-yellow-800 dark:bg-yellow-950 dark:text-yellow-200' : 'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200'">{{ priorities[task.priority] }}</span>
    <span class="text-xs text-gray-500 dark:text-gray-400">#{{ task.id.slice(0, 4) }}</span>
  </div>
  <button class="block w-full rounded text-left focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400" (click)="selected.emit(task)">
    <h4 class="text-sm font-semibold text-gray-900 dark:text-gray-100">{{ task.title }}</h4>
    <p *ngIf="task.description" class="mt-2 line-clamp-2 text-xs leading-relaxed text-gray-500 dark:text-gray-400">{{ task.description }}</p>
  </button>
  <div class="mt-2 flex flex-wrap gap-2" *ngIf="task.tags?.length"><span *ngFor="let tag of task.tags" class="rounded bg-gray-50 px-2 py-1 text-xs text-gray-500 dark:bg-gray-700 dark:text-gray-300">{{ tag }}</span></div>
  <select class="mt-4 min-h-11 max-w-full rounded-lg border border-gray-200 bg-white p-2 text-xs text-gray-700 focus-visible:outline-2 focus-visible:outline-blue-600 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-300" [attr.aria-label]="'Statut de ' + task.title" [ngModel]="task.status" (ngModelChange)="statusChange.emit($event)"><option value="todo">À faire</option><option value="in-progress">En cours</option><option value="done">Terminé</option></select>
  <div *ngIf="task.subTasks.length > 0" class="subtask-progress mt-4">
    <div class="mb-2 flex justify-between gap-2 text-xs text-gray-500 dark:text-gray-400"><span>Progression</span><span class="font-medium text-gray-700 dark:text-gray-300">{{ getCompletedSubTasksCount() }}/{{ task.subTasks.length }}</span></div>
    <div class="h-1 overflow-hidden rounded-full bg-gray-100 dark:bg-gray-700" role="progressbar" [attr.aria-label]="'Sous-tâches de ' + task.title" [attr.aria-valuenow]="getCompletedSubTasksCount()" aria-valuemin="0" [attr.aria-valuemax]="task.subTasks.length"><span class="block h-full rounded-full bg-blue-600 transition-all duration-200 motion-reduce:transition-none dark:bg-blue-400" [style.width.%]="getCompletedSubTasksCount() / task.subTasks.length * 100"></span></div>
  </div>
  <footer class="mt-4 flex flex-wrap items-center justify-between gap-2 border-t border-gray-100 pt-2 dark:border-gray-700">
    <span class="text-xs text-gray-500 dark:text-gray-400" [ngClass]="isLate() ? 'text-red-700 dark:text-red-300' : ''" *ngIf="task.dueDate; else noDate">{{ isLate() ? 'En retard · ' : isToday() ? 'Aujourd’hui · ' : '' }}{{ task.dueDate | date:'dd/MM/yyyy' }}</span>
    <ng-template #noDate><span class="text-xs text-gray-500 dark:text-gray-400">Sans échéance</span></ng-template>
    <div class="card-actions flex gap-2 opacity-0 transition-opacity duration-200 group-hover:opacity-100 group-focus-within:opacity-100 [@media(hover:none)]:opacity-100 [@media(pointer:coarse)]:opacity-100 motion-reduce:transition-none">
      <button class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-lg p-2 text-gray-500 hover:bg-blue-50 hover:text-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:text-gray-400 dark:hover:bg-blue-950 dark:hover:text-blue-300" (click)="edit.emit(task)" [attr.aria-label]="'Modifier ' + task.title" title="Modifier"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="m16 3 5 5-12 12-6 1 1-6Z M14 5l5 5"/></svg></button>
      <button class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-lg p-2 text-gray-500 hover:bg-blue-50 hover:text-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:text-gray-400 dark:hover:bg-blue-950 dark:hover:text-blue-300" (click)="duplicate.emit(task)" [attr.aria-label]="'Dupliquer ' + task.title" title="Dupliquer"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg></button>
      <button class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-lg p-2 text-gray-500 hover:bg-blue-50 hover:text-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:text-gray-400 dark:hover:bg-blue-950 dark:hover:text-blue-300" (click)="archive.emit(task)" [attr.aria-label]="'Archiver ' + task.title" title="Archiver"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M4 8v12h16V8 M9 12h6"/><rect x="3" y="3" width="18" height="5" rx="1"/></svg></button>
    </div>
  </footer>
</article>
