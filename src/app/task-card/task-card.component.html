<div *ngIf="task" (click)="onClick()" class="p-4 bg-white border-l-4 shadow rounded hover:shadow-md transition cursor-pointer"
     [ngClass]="{
       'border-blue-500': task.status === 'todo',
       'border-yellow-500': task.status === 'in-progress',
       'border-green-500': task.status === 'done'
     }">
  <h3 class="font-bold text-lg">{{ task.title }}</h3>
  <p class="text-sm text-gray-600 mt-1">{{ task.description }}</p>

  <div class="mt-4 flex space-x-4">
    <button (click)="onEdit($event)" class="text-blue-500 hover:text-blue-700">Modifier</button>
    <button (click)="onDelete($event)" class="text-red-500 hover:text-red-700">Supprimer</button>
  </div>
</div>
