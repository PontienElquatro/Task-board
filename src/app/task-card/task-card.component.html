<article *ngIf="task" class="task-card group rounded-xl border border-gray-200 bg-white p-2 shadow-sm transition-shadow duration-200 hover:shadow-md dark:border-gray-700 dark:bg-gray-800">
  <div class="flex items-start gap-2">
    <label class="flex min-h-11 min-w-11 cursor-pointer items-center justify-center rounded-lg hover:bg-blue-50 dark:hover:bg-blue-950" [attr.aria-label]="'Terminer ou rouvrir : ' + task.title">
      <input type="checkbox" class="h-4 w-4 accent-blue-600" [checked]="task.status === 'done'" (change)="statusChange.emit(task.status === 'done' ? 'in-progress' : 'done')" (pointerdown)="$event.stopPropagation()" />
    </label>
    <button class="min-h-11 min-w-0 flex-1 rounded-lg py-2 text-left focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-600" (click)="selected.emit(task)">
      <h4 class="break-words text-sm font-semibold text-gray-900 dark:text-gray-100" [class.line-through]="task.status === 'done'">{{ task.title }}</h4>
    </button>
    <details class="relative shrink-0" #actions (keydown.escape)="actions.open=false">
      <summary class="flex min-h-11 min-w-11 cursor-pointer list-none items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-600 dark:text-gray-400 dark:hover:bg-gray-700 [&::-webkit-details-marker]:hidden" [attr.aria-label]="'Actions pour ' + task.title">•••</summary>
      <div class="absolute right-0 top-full z-20 grid w-48 gap-2 rounded-xl border border-gray-200 bg-white p-2 shadow-lg dark:border-gray-700 dark:bg-gray-900">
        <button class="min-h-11 rounded-lg p-2 text-left text-sm hover:bg-blue-50 dark:hover:bg-blue-950" (click)="selected.emit(task); actions.open=false">Ouvrir les détails</button>
        <button class="min-h-11 rounded-lg p-2 text-left text-sm hover:bg-blue-50 dark:hover:bg-blue-950" (click)="duplicate.emit(task); actions.open=false">Dupliquer</button>
        <button class="min-h-11 rounded-lg p-2 text-left text-sm hover:bg-blue-50 dark:hover:bg-blue-950" (click)="archive.emit(task); actions.open=false">Archiver</button>
        <label class="grid gap-2 text-xs">Statut<select class="min-h-11 rounded-lg border border-gray-200 bg-white p-2 dark:border-gray-700 dark:bg-gray-800" [ngModel]="task.status" (ngModelChange)="statusChange.emit($event); actions.open=false"><option value="todo">À faire</option><option value="in-progress">En cours</option><option value="done">Terminé</option></select></label>
      </div>
    </details>
  </div>
  <div *ngIf="task.dueDate || task.subTasks.length || task.priority === 'high' || task.tags?.length" class="flex flex-wrap items-center gap-2 pb-2 pl-12 text-xs text-gray-500 dark:text-gray-400">
    <span *ngIf="task.priority === 'high'" class="text-red-700 dark:text-red-300">Prioritaire</span>
    <span *ngIf="task.dueDate" [ngClass]="isLate() ? 'text-red-700 dark:text-red-300' : ''">{{ isLate() ? 'En retard · ' : '' }}{{ task.dueDate | date:'dd/MM' }}</span>
    <span *ngIf="task.subTasks.length" [attr.aria-label]="'Sous-tâches terminées : ' + getCompletedSubTasksCount() + ' sur ' + task.subTasks.length">☑ {{ getCompletedSubTasksCount() }}/{{ task.subTasks.length }}</span>
    <span *ngIf="task.tags?.length" class="max-w-24 truncate">{{ task.tags?.[0] }}<span *ngIf="(task.tags?.length || 0) > 1"> +{{(task.tags?.length || 0) - 1}}</span></span>
  </div>
</article>
