<article *ngIf="task" class="task-card group rounded-xl border border-gray-200 bg-white p-4 shadow-none transition-all duration-200 ease-in-out hover:-translate-y-0.5 hover:shadow-md motion-reduce:transform-none motion-reduce:transition-none dark:border-gray-700 dark:bg-gray-800">
  <div class="mb-2 flex items-center justify-between gap-2">
    <span class="rounded px-2 py-1 text-xs font-medium" [ngClass]="task.priority === 'high' ? 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-200' : task.priority === 'medium' ? 'bg-yellow-100 text-yellow-800 dark:bg-yellow-950 dark:text-yellow-200' : 'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200'">{{ priorities[task.priority] }}</span>
  </div>
  <button class="block min-h-11 w-full rounded text-left focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400" (click)="selected.emit(task)">
    <h4 class="text-sm font-semibold text-gray-900 dark:text-gray-100">{{ task.title }}</h4>
    <p *ngIf="task.description" class="mt-2 line-clamp-2 text-xs leading-relaxed text-gray-500 dark:text-gray-400">{{ task.description }}</p>
  </button>
  <div class="mt-2 flex flex-wrap gap-2" *ngIf="task.tags?.length"><span *ngFor="let tag of task.tags" class="rounded bg-gray-50 px-2 py-1 text-xs text-gray-500 dark:bg-gray-700 dark:text-gray-300">{{ tag }}</span></div>
  <div *ngIf="task.subTasks.length > 0" class="subtask-progress mt-4">
    <div class="mb-2 flex justify-between gap-2 text-xs text-gray-500 dark:text-gray-400"><span>Progression</span><span class="font-medium text-gray-700 dark:text-gray-300">{{ getCompletedSubTasksCount() }}/{{ task.subTasks.length }}</span></div>
    <div class="h-1 overflow-hidden rounded-full bg-gray-100 dark:bg-gray-700" role="progressbar" [attr.aria-label]="'Sous-tâches de ' + task.title" [attr.aria-valuenow]="getCompletedSubTasksCount()" aria-valuemin="0" [attr.aria-valuemax]="task.subTasks.length"><span class="block h-full rounded-full bg-blue-600 transition-all duration-200 motion-reduce:transition-none dark:bg-blue-400" [style.width.%]="getCompletedSubTasksCount() / task.subTasks.length * 100"></span></div>
  </div>
  <footer class="mt-2 flex flex-wrap items-center justify-between gap-2">
    <span class="text-xs text-gray-500 dark:text-gray-400" [ngClass]="isLate() ? 'text-red-700 dark:text-red-300' : ''" *ngIf="task.dueDate; else noDate">{{ isLate() ? 'En retard · ' : isToday() ? 'Aujourd’hui · ' : '' }}{{ task.dueDate | date:'dd/MM/yyyy' }}</span>
    <ng-template #noDate><span class="sr-only">Sans échéance</span></ng-template>
    <details class="relative ml-auto [&[open]]:w-full" #actions (keydown.escape)="actions.open=false">
      <summary class="flex min-h-11 min-w-11 cursor-pointer list-none items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700 [&::-webkit-details-marker]:hidden" [attr.aria-label]="'Actions pour ' + task.title">•••</summary>
      <div class="card-actions mt-2 grid w-full gap-2 rounded-xl border border-gray-200 bg-gray-50 p-2 dark:border-gray-600 dark:bg-gray-900">
      <button class="flex min-h-11 items-center gap-2 rounded-lg p-2 text-left text-sm text-gray-700 hover:bg-blue-50 dark:text-gray-200 dark:hover:bg-blue-950" (click)="edit.emit(task)" [attr.aria-label]="'Modifier ' + task.title">Modifier</button>
      <button class="flex min-h-11 items-center gap-2 rounded-lg p-2 text-left text-sm text-gray-700 hover:bg-blue-50 dark:text-gray-200 dark:hover:bg-blue-950" (click)="duplicate.emit(task)" [attr.aria-label]="'Dupliquer ' + task.title">Dupliquer</button>
      <button class="flex min-h-11 items-center gap-2 rounded-lg p-2 text-left text-sm text-gray-700 hover:bg-blue-50 dark:text-gray-200 dark:hover:bg-blue-950" (click)="archive.emit(task)" [attr.aria-label]="'Archiver ' + task.title">Archiver</button>
      <label class="grid gap-2 border-t border-gray-200 p-2 text-xs text-gray-600 dark:border-gray-600 dark:text-gray-300">Changer le statut<select class="min-h-11 w-full rounded-lg p-2 text-xs" [attr.aria-label]="'Statut de ' + task.title" [ngModel]="task.status" (ngModelChange)="statusChange.emit($event); actions.open=false"><option value="todo">À faire</option><option value="in-progress">En cours</option><option value="done">Terminé</option></select></label>
      </div>
    </details>
  </footer>
</article>
