<a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[200] focus:rounded-lg focus:bg-blue-600 focus:p-4 focus:text-white">Aller au contenu</a>
<div class="update-banner" role="status" *ngIf="updateReady()">Une nouvelle version est prête. Vos tâches enregistrées seront conservées.<button class="primary" (click)="reload()">Actualiser l’application</button></div>
<app-maat-loader *ngIf="loading()" />
<div [attr.aria-busy]="loading()" [attr.inert]="loading() ? '' : null">
  <app-account-bar *ngIf="!authLayout()" />
  <div [class.application-workspace]="workspaceLayout()">
    <app-workspace-nav *ngIf="workspaceLayout()" />
    <div class="application-content"><router-outlet /></div>
  </div>
</div>
<app-toast />
