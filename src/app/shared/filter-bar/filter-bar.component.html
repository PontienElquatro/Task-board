        <div class="flex flex-wrap items-center gap-4">
          <label class="flex min-h-11 min-w-0 flex-1 basis-full items-center gap-2 rounded-lg border border-gray-200 bg-white px-4 text-gray-500 sm:basis-auto dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400"><app-icon name="search" class="text-blue-600 dark:text-blue-300" /><input class="min-w-0 flex-1 border-0 bg-transparent p-2 text-sm text-gray-900 dark:text-gray-100 dark:placeholder:text-gray-400" id="task-search" type="search" placeholder="Rechercher une tâche…" aria-label="Rechercher une tâche" [ngModel]="taskService.searchTerm()" (ngModelChange)="taskService.searchTerm.set($event)"><kbd>/</kbd></label>
          <div class="relative"><select class="min-h-11 appearance-none rounded-xl border border-blue-100 bg-blue-50 py-2 pl-3 pr-10 text-sm text-indigo-950 focus-visible:outline-2 focus-visible:outline-blue-600 dark:border-indigo-900 dark:bg-indigo-950 dark:text-blue-200" aria-label="Filtrer par statut" [ngModel]="taskService.filterStatus()" (ngModelChange)="taskService.filterStatus.set($event)"><option value="all">Tous les statuts</option><option value="todo">À faire</option><option value="in-progress">En cours</option><option value="done">Terminé</option></select><app-icon name="chevron" class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-blue-600 dark:text-blue-300" /></div>
          <details class="group min-w-0 max-w-full sm:relative" #advancedFilters (keydown.escape)="advancedFilters.open=false">
            <summary class="flex min-h-11 cursor-pointer list-none items-center gap-2 rounded-xl border border-blue-100 bg-white px-4 py-2 text-sm font-medium text-indigo-950 transition-colors duration-200 hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-blue-950 [&::-webkit-details-marker]:hidden"><app-icon name="filter" class="text-blue-600 dark:text-blue-300" />Filtres avancés <span *ngIf="advancedCount()" class="rounded bg-blue-50 px-2 text-blue-700 dark:bg-blue-950 dark:text-blue-300">{{advancedCount()}}</span><app-icon name="chevron" class="text-indigo-700 transition-transform duration-200 group-open:rotate-180 dark:text-blue-300 motion-reduce:transition-none" /></summary>
            <div class="z-30 mt-2 grid w-full gap-4 rounded-xl border border-gray-200 bg-white p-4 shadow-md sm:absolute sm:right-0 sm:w-80 dark:border-gray-700 dark:bg-gray-800">
              <label class="grid gap-2 text-xs text-gray-600 dark:text-gray-300">Projet<select class="min-h-11 w-full" aria-label="Filtrer par projet" [ngModel]="taskService.filterProject()" (ngModelChange)="taskService.filterProject.set($event)"><option value="">Tous les projets</option><option *ngFor="let project of projects" [value]="project.id">{{project.title}}</option></select></label>
              <label class="grid gap-2 text-xs text-gray-500 dark:text-gray-400">Priorité<select class="min-h-11 rounded-lg border border-gray-200 bg-white p-2 text-sm text-gray-700 focus-visible:outline-2 focus-visible:outline-blue-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300" aria-label="Filtrer par priorité" [ngModel]="taskService.filterPriority()" (ngModelChange)="taskService.filterPriority.set($event)"><option value="all">Toutes les priorités</option><option value="high">Haute</option><option value="medium">Moyenne</option><option value="low">Basse</option></select></label>
<label class="grid gap-2 text-xs text-gray-500 dark:text-gray-400">Tags<select class="min-h-11 rounded-lg border border-gray-200 bg-white p-2 text-sm text-gray-700 focus-visible:outline-2 focus-visible:outline-blue-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300" aria-label="Filtrer par tag" [ngModel]="taskService.filterTag()" (ngModelChange)="taskService.filterTag.set($event)"><option value="">Tous les tags</option><option *ngFor="let tag of taskService.tags()" [value]="tag">{{ tag }}</option></select></label>
<label class="grid gap-2 text-xs text-gray-500 dark:text-gray-400">Échéance<select class="min-h-11 rounded-lg border border-gray-200 bg-white p-2 text-sm text-gray-700 focus-visible:outline-2 focus-visible:outline-blue-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300" aria-label="Filtrer par échéance" [ngModel]="taskService.filterDue()" (ngModelChange)="taskService.filterDue.set($event)"><option value="all">Toutes les échéances</option><option value="late">En retard</option><option value="none">Sans échéance</option></select></label>
<label class="grid gap-2 text-xs text-gray-500 dark:text-gray-400">Ordre<select class="min-h-11 rounded-lg border border-gray-200 bg-white p-2 text-sm text-gray-700 focus-visible:outline-2 focus-visible:outline-blue-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300" aria-label="Trier les tâches" [ngModel]="taskService.sort()" (ngModelChange)="taskService.sort.set($event)"><option value="manual">Ordre manuel</option><option value="priority">Par priorité</option><option value="due">Par échéance</option><option value="newest">Plus récentes</option></select></label>
              <button class="secondary min-h-11" (click)="advancedFilters.open=false">Afficher les résultats</button>
            </div>
          </details>
          <button *ngIf="hasActiveFilters" class="min-h-11 rounded-lg px-4 py-2 text-sm text-blue-600 hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-blue-600 dark:text-blue-400 dark:hover:bg-blue-950" (click)="resetFilters.emit()">Effacer</button>
        </div>
