        <div class="flex flex-wrap items-center gap-4">
          <label class="flex min-h-11 min-w-0 flex-1 items-center gap-2 rounded-lg border border-gray-200 bg-white px-4 text-gray-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400"><span aria-hidden="true">⌕</span><input class="min-w-0 flex-1 border-0 bg-transparent p-2 text-sm text-gray-900 dark:text-gray-100 dark:placeholder:text-gray-400" id="task-search" type="search" placeholder="Rechercher une tâche…" aria-label="Rechercher une tâche" [ngModel]="taskService.searchTerm()" (ngModelChange)="taskService.searchTerm.set($event)"><kbd>/</kbd></label>
          <select class="min-h-11 rounded-lg border border-gray-200 bg-white p-2 text-sm text-gray-700 focus-visible:outline-2 focus-visible:outline-blue-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300" aria-label="Filtrer par statut" [ngModel]="taskService.filterStatus()" (ngModelChange)="taskService.filterStatus.set($event)"><option value="all">Tous les statuts</option><option value="todo">À faire</option><option value="in-progress">En cours</option><option value="done">Terminé</option></select>
          <details class="group min-w-0 max-w-full sm:relative">
            <summary class="flex min-h-11 cursor-pointer list-none items-center gap-2 rounded-lg border border-gray-200 bg-white px-4 py-2 text-sm font-medium text-gray-700 transition-colors duration-200 hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-blue-950 [&::-webkit-details-marker]:hidden">Filtres avancés <span aria-hidden="true" class="transition-transform duration-200 group-open:rotate-180">⌄</span></summary>
            <div class="z-30 mt-2 grid w-full gap-4 rounded-xl border border-gray-200 bg-white p-4 shadow-md sm:absolute sm:right-0 sm:w-80 dark:border-gray-700 dark:bg-gray-800">
              <label class="grid gap-2 text-xs text-gray-500 dark:text-gray-400">Priorité<select class="min-h-11 rounded-lg border border-gray-200 bg-white p-2 text-sm text-gray-700 focus-visible:outline-2 focus-visible:outline-blue-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300" aria-label="Filtrer par priorité" [ngModel]="taskService.filterPriority()" (ngModelChange)="taskService.filterPriority.set($event)"><option value="all">Toutes les priorités</option><option value="high">Haute</option><option value="medium">Moyenne</option><option value="low">Basse</option></select></label>
<label class="grid gap-2 text-xs text-gray-500 dark:text-gray-400">Tags<select class="min-h-11 rounded-lg border border-gray-200 bg-white p-2 text-sm text-gray-700 focus-visible:outline-2 focus-visible:outline-blue-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300" aria-label="Filtrer par tag" [ngModel]="taskService.filterTag()" (ngModelChange)="taskService.filterTag.set($event)"><option value="">Tous les tags</option><option *ngFor="let tag of taskService.tags()" [value]="tag">{{ tag }}</option></select></label>
<label class="grid gap-2 text-xs text-gray-500 dark:text-gray-400">Échéance<select class="min-h-11 rounded-lg border border-gray-200 bg-white p-2 text-sm text-gray-700 focus-visible:outline-2 focus-visible:outline-blue-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300" aria-label="Filtrer par échéance" [ngModel]="taskService.filterDue()" (ngModelChange)="taskService.filterDue.set($event)"><option value="all">Toutes les échéances</option><option value="late">En retard</option><option value="none">Sans échéance</option></select></label>
<label class="grid gap-2 text-xs text-gray-500 dark:text-gray-400">Ordre<select class="min-h-11 rounded-lg border border-gray-200 bg-white p-2 text-sm text-gray-700 focus-visible:outline-2 focus-visible:outline-blue-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300" aria-label="Trier les tâches" [ngModel]="taskService.sort()" (ngModelChange)="taskService.sort.set($event)"><option value="manual">Ordre manuel</option><option value="priority">Par priorité</option><option value="due">Par échéance</option><option value="newest">Plus récentes</option></select></label>
              <p class="text-xs text-gray-500 dark:text-gray-400">Cliquez à nouveau sur « Filtres avancés » pour fermer.</p>
            </div>
          </details>
          <button *ngIf="hasActiveFilters" class="min-h-11 rounded-lg px-4 py-2 text-sm text-blue-600 hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-blue-600 dark:text-blue-400 dark:hover:bg-blue-950" (click)="resetFilters.emit()">Effacer</button>
        </div>
